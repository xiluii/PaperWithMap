<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <script>
      (() => {
        let preference = 'system';
        try { preference = localStorage.getItem('paperly:theme') || 'system'; } catch {}
        const theme = preference === 'dark' || preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101923' : '#edf2f6';
      })();
    </script>
    <meta name="description" content="Paperly 纸间 — 在无限画布中整理文献、连接灵感，构建属于你的知识版图。" />
    <title>Paperly 纸间 · 文献与灵感的连接之处</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
